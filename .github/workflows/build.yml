name: Build HANA-Lens

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--no-bundle'
          - platform: macos-14
            args: '--target aarch64-apple-darwin --bundles app'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Generate app icons
        run: python3 scripts/gen-icons.py

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri app
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Create Windows portable ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $exe = "src-tauri/target/release/HANA-Lens.exe"
          if (Test-Path $exe) {
            New-Item -ItemType Directory -Path "pkg" -Force | Out-Null
            Copy-Item $exe "pkg\HANA-Lens.exe"
            if (Test-Path "final-package-files") {
              Get-ChildItem "final-package-files" | Copy-Item -Recurse -Destination "pkg\"
            }
            Compress-Archive -Path "pkg\*" -DestinationPath "HANA-Lens_${ver}_x64-portable.zip"
            Remove-Item -Recurse -Force "pkg"
          }

      - name: Package macOS DMG
        if: matrix.platform == 'macos-14'
        shell: bash
        run: |
          ver="${{ steps.ver.outputs.version }}"
          app_path=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name "*.app" 2>/dev/null | head -1)
          if [ -n "$app_path" ]; then
            tmp_dir=$(mktemp -d)
            cp -r "$app_path" "$tmp_dir/"
            tmp_app="$tmp_dir/$(basename "$app_path")"
            if [ -d "final-package-files" ]; then
              cp -r final-package-files/* "$tmp_app/Contents/Resources/"
            fi
            hdiutil create -srcfolder "$tmp_app" -volname "HANA-Lens" -format UDZO \
              -o "HANA-Lens_${ver}_aarch64.dmg"
            rm -rf "$tmp_dir"
          fi

      - name: Remove stale .exe and .msi release assets
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          tag="${{ steps.ver.outputs.version }}"
          for ext in exe msi; do
            assets=$(gh release view "$tag" --json assets -q ".assets[] | select(.name | endswith(\".$ext\")) | .name" 2>/dev/null || true)
            for asset in $assets; do
              gh release delete-asset "$tag" "$asset" --yes 2>/dev/null || true
            done
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: HANA-Lens v.${{ steps.ver.outputs.version }}
          draft: true
          prerelease: false
          files: |
            HANA-Lens_*_x64-portable.zip
            HANA-Lens_*_aarch64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
