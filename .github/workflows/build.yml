name: Build HANA-Lens

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-14
            args: '--target aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Generate app icons
        run: python3 scripts/gen-icons.py

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri app
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Rename Windows installer
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $src = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*x64-setup.exe" | Select-Object -First 1
          if ($src) { Move-Item $src.FullName "HANA-Lens_${ver}_x64-setup.exe" }
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) { Move-Item $msi.FullName "HANA-Lens_${ver}_x64.msi" }

      - name: Create Windows portable ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $exe = "src-tauri/target/release/HANA-Lens.exe"
          if (Test-Path $exe) {
            Compress-Archive -Path $exe -DestinationPath "HANA-Lens_${ver}_x64-portable.zip"
          }

      - name: Rename macOS DMG
        if: matrix.platform == 'macos-14'
        shell: bash
        run: |
          ver="${{ steps.ver.outputs.version }}"
          dmg=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -1)
          if [ -n "$dmg" ]; then mv "$dmg" "HANA-Lens_${ver}_aarch64.dmg"; fi

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: HANA-Lens v.${{ steps.ver.outputs.version }}
          draft: true
          prerelease: false
          files: |
            HANA-Lens_*.exe
            HANA-Lens_*.msi
            HANA-Lens_*.zip
            HANA-Lens_*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
